<!DOCTYPE html>
<!--
HUD widget — small always-on-top window that displays live per-site usage.
Loaded by main.js into a frameless transparent BrowserWindow at 260x160 anchored
to the bottom-right of the primary display. Receives 'usage-updated' / 'deep-work-update'
events via hudPreload.js (window.hudAPI).
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
    <title>FocusGuard HUD</title>
    <style>
        :root {
            --bg: rgba(15, 16, 17, 0.96);
            --line: rgba(38, 39, 42, 0.9);
            --line-soft: rgba(28, 29, 31, 0.9);
            --ink: #e6e6e6;
            --ink-2: #9ca0a8;
            --ink-3: #5b6066;
            --accent: #5e6ad2;
            --accent-2: #8b95f8;
            --warn: #ffb224;
            --bad: #eb5757;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: transparent;
            font-family: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--ink);
            -webkit-user-select: none;
            user-select: none;
        }
        #hud {
            width: 260px; height: 160px;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex; flex-direction: column;
            -webkit-app-region: drag;
            overflow: hidden;
        }
        button, #close-hud, #hud-rows { -webkit-app-region: no-drag; }
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 10px; border-bottom: 1px solid var(--line-soft);
        }
        .brand { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--ink); }
        .brand-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: linear-gradient(180deg, var(--accent) 0%, var(--accent-2) 100%);
        }
        .total { font-size: 10px; color: var(--ink-2); font-feature-settings: "tnum"; }
        #close-hud {
            background: transparent; border: 0; color: var(--ink-3); font-size: 14px; cursor: pointer; padding: 0 4px;
        }
        #close-hud:hover { color: var(--ink); }
        #hud-rows {
            flex: 1; padding: 6px 10px; display: flex; flex-direction: column; gap: 5px;
            overflow-y: auto;
        }
        #hud-rows::-webkit-scrollbar { display: none; }
        .row { display: flex; align-items: center; gap: 6px; font-size: 11px; }
        .row .name { width: 54px; color: var(--ink); flex-shrink: 0; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row .bar-track { flex: 1; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
        .row .bar { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.4s ease, background 0.2s; }
        .row .num { width: 50px; text-align: right; font-feature-settings: "tnum"; font-family: ui-monospace, "Cascadia Mono", monospace; font-size: 10px; color: var(--ink-2); }
        .row.warn .bar { background: var(--warn); }
        .row.warn .num { color: var(--warn); }
        .row.over .bar { background: var(--bad); }
        .row.over .num { color: var(--bad); }
        .row.idle .num { color: var(--ink-3); }
        footer {
            font-size: 10px; padding: 4px 10px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(94, 106, 210, 0.12);
            border-top: 1px solid rgba(94, 106, 210, 0.4);
            color: var(--accent-2);
            font-weight: 600;
            letter-spacing: 0.04em;
        }
        footer.hidden { display: none; }
        .empty { color: var(--ink-3); font-size: 11px; text-align: center; padding: 20px 10px; }
    </style>
</head>
<body>
    <div id="hud">
        <header>
            <div class="brand">
                <span class="brand-dot"></span>
                <span>FocusGuard</span>
            </div>
            <div style="display:flex; align-items:center; gap:6px;">
                <span class="total" id="hud-total">0m today</span>
                <button id="close-hud" title="Hide HUD">&times;</button>
            </div>
        </header>
        <div id="hud-rows">
            <div class="empty" id="hud-empty">Waiting for activity&hellip;</div>
        </div>
        <footer id="hud-deepwork" class="hidden">
            <span>&bull; Deep Work</span>
            <span id="hud-dw-time">--</span>
        </footer>
    </div>
    <script src="hudRenderer.js"></script>
</body>
</html>
